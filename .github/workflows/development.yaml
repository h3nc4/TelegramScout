name: TelegramScout Development CI

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 UTC
  workflow_dispatch:

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/go-mod:/cache/go-mod -v ${HOME:?}/ci-cache/go-build:/cache/go-build -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
        with:
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/go-mod
            ~/ci-cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/go-mod
          mkdir -p ~/ci-cache/go-build
      - name: Lint, test and build
        run: |
          $DEV_RUN -c '
            set -e
            go mod download
            if [ -n "$(gofmt -l .)" ]; then
              echo "Go code is not formatted:"
              gofmt -d .
              exit 1
            fi
            GOFLAGS="-buildvcs=false" golangci-lint run ./...
            shellcheck scripts/*.sh
            go test -v -coverprofile=coverage.out ./...
            go build -buildvcs=false -o telegram-scout ./cmd/telegram-scout
          '
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: coverage.out
          retention-days: 1

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: code-coverage
      - name: Name the image the scan comes from
        run: |
          image="$(sed -n 's|^FROM \(h3nc4/dev-base:[^ ]*\) AS main|\1|p' docker/dev.Dockerfile)"
          case "${image}" in
            h3nc4/dev-base:*@sha256:*) ;;
            *) echo "::error::docker/dev.Dockerfile names no pinned dev-base to take the scan from"; exit 1 ;;
          esac
          echo "SCAN_IMAGE=${image}" >>"${GITHUB_ENV}"
      - name: Run h3nc4/sonar-action
        uses: h3nc4/sonar-action@f16ceef53c5a806b98ac93fc631ce62875e929fd # v1
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          image: ${{ env.SCAN_IMAGE }}
          script: /usr/local/bin/sonar

  build-test-container:
    name: Build and Test Runtime Container
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Prepare metadata
        id: meta
        run: |
          image="${{ vars.DOCKERHUB_USERNAME }}/telegram-scout"
          tags="${image}:latest"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          {
            echo "PUSH=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
            echo "IMAGE=${image}"
            echo "TAGS=${tags}"
            echo "DEV_IMAGE=$(scripts/devcontainer-image.sh)"
          } >>"$GITHUB_OUTPUT"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
      - name: Name the resolved image as the Dockerfile expects
        run: docker tag "${DEV_IMAGE:?}" "${{ steps.meta.outputs.DEV_IMAGE }}"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker
      - name: Run docker/login-action
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: Build Container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ steps.meta.outputs.PUSH }}
          load: true
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            DEV_IMAGE=${{ steps.meta.outputs.DEV_IMAGE }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
      - name: Run container
        run: |
          CONTAINER_ID=$(docker run -d ${{ steps.meta.outputs.IMAGE }}:latest)
          echo "CONTAINER_ID=${CONTAINER_ID}" >>"${GITHUB_ENV}"
      - name: Verify logs
        run: |
          for i in $(seq 1 10); do
            if docker logs "${CONTAINER_ID}" 2>&1 | grep -qi "failed to load configuration"; then
              echo "Container output verified."
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 3
          done
          echo "Container did not start." >&2
          docker logs "${CONTAINER_ID}" >&2
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f "${CONTAINER_ID}"
