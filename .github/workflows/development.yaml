name: TelegramScout Development CI

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/go-mod:/cache/go-mod -v ${HOME:?}/ci-cache/go-build:/cache/go-build -e GOMODCACHE=/cache/go-mod -e GOCACHE=/cache/go-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@896daea2e2bdda063d6992243c634f156ce057ac # v1
        with:
          published-repo: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/go-mod
            ~/ci-cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/go-mod
          mkdir -p ~/ci-cache/go-build
      - name: Lint, test and build
        run: |
          $DEV_RUN -c '
            set -e
            go mod download
            if [ -n "$(gofmt -l .)" ]; then
              echo "Go code is not formatted:"
              gofmt -d .
              exit 1
            fi
            GOFLAGS="-buildvcs=false" golangci-lint run ./...
            shellcheck scripts/*.sh
            go test -v -coverprofile=coverage.out ./...
            go build -buildvcs=false -o telegram-scout ./cmd/telegram-scout
          '
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          path: coverage.out
          retention-days: 1

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: code-coverage
      - name: Run SonarQube analysis
        run: ./scripts/sonar.sh

  build-test-container:
    name: Build and Test Runtime Container
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare metadata
        id: meta
        run: |
          echo "PUSH=${{ github.ref == 'refs/heads/main' }}" >>$GITHUB_OUTPUT
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >>$GITHUB_OUTPUT
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAGS=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest,${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:$SHORT_SHA" >>$GITHUB_OUTPUT
          else
            echo "TAGS=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest" >>$GITHUB_OUTPUT
          fi
      - name: Run actions/checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read the published dev image tag
        id: dev_tag
        run: echo "tag=$(cat .github/VERSION)" >>"$GITHUB_OUTPUT"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: Build Container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ steps.meta.outputs.PUSH }}
          load: true
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            DEV_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev:${{ steps.dev_tag.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
      - name: Run container
        run: |
          CONTAINER_ID=$(docker run -d ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest)
          echo "CONTAINER_ID=${CONTAINER_ID}" >>"${GITHUB_ENV}"
      - name: Verify logs
        run: |
          for i in $(seq 1 10); do
            if docker logs "${CONTAINER_ID}" 2>&1 | grep -qi "failed to load configuration"; then
              echo "Container output verified."
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 3
          done
          echo "Container did not start." >&2
          docker logs "${CONTAINER_ID}" >&2
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f "${CONTAINER_ID}"
